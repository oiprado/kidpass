server:
  port: 8084

spring:
  config:
    import: "optional:configserver:"
  application:
    name: activity-service
  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/kidpass

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans