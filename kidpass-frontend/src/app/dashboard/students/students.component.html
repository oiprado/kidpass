<h2>Students</h2>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Age</th>
      <th>Grade</th>
      <th>Allergies</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let student of students">
      <td>{{ student.id }}</td>
      <td>{{ student.firstName }}</td>
      <td>{{ student.lastName }}</td>
      <td>{{ student.age }}</td>
      <td>{{ student.grade }}</td>
      <td>{{ student.allergies }}</td>
    </tr>
  </tbody>
</table>

<div *ngIf="students.length === 0">
  <p>No students found.</p>
</div>
