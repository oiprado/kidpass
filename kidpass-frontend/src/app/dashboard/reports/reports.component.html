<h2>Reports</h2>

<div *ngIf="reports.length > 0; else noReports">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let report of reports">
        <td>{{ report.id }}</td>
        <td>{{ report.name }}</td>
        <td>{{ report.type }}</td>
        <td>{{ report.description }}</td>
      </tr>
    </tbody>
  </table>
</div>
<ng-template #noReports>
  <p>No reports found.</p>
</ng-template>
