<h2>Authorizations</h2>

<div *ngIf="authorizations.length > 0; else noAuthorizations">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Student ID</th>
        <th>Type</th>
        <th>Status</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let authorization of authorizations">
        <td>{{ authorization.id }}</td>
        <td>{{ authorization.studentId }}</td>
        <td>{{ authorization.type }}</td>
        <td>{{ authorization.status }}</td>
        <td>{{ authorization.description }}</td>
      </tr>
    </tbody>
  </table>
</div>
<ng-template #noAuthorizations>
  <p>No authorizations found.</p>
</ng-template>
